<svg width="720" height="430" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <rect width="720" height="430" fill="#f8f9fc" rx="12"/>

  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1629">Exam script — 4-phase session flow</text>
  <text x="360" y="50" text-anchor="middle" font-size="11" fill="#8496c0">One screen per question · Prolog queried once at the end</text>

  <defs>
    <marker id="arrFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8496c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrProlog" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── Phase boxes (top row) ── -->

  <!-- Phase 1 -->
  <rect x="40" y="70" width="148" height="160" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <rect x="40" y="70" width="148" height="32" rx="10" fill="#378ADD"/>
  <rect x="40" y="88" width="148" height="14" fill="#378ADD"/>
  <text x="114" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Phase 1</text>
  <text x="114" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">Demographics</text>
  <text x="114" y="126" text-anchor="middle" font-size="10" fill="#185FA5">Select presentation</text>
  <text x="114" y="141" text-anchor="middle" font-size="10" fill="#185FA5">Enter age</text>
  <text x="114" y="156" text-anchor="middle" font-size="10" fill="#185FA5">Select sex</text>
  <rect x="56" y="170" width="116" height="48" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.7"/>
  <text x="114" y="189" text-anchor="middle" font-size="10" fill="#042C53" font-weight="500">assert:</text>
  <text x="114" y="204" text-anchor="middle" font-size="10" fill="#042C53" font-family="monospace">patient_age(N)</text>
  <text x="114" y="218" text-anchor="middle" font-size="10" fill="#042C53" font-family="monospace">patient_sex(S)</text>

  <!-- Arrow 1→2 -->
  <line x1="188" y1="152" x2="208" y2="152" stroke="#8496c0" stroke-width="1.5" marker-end="url(#arrFlow)"/>

  <!-- Phase 2 -->
  <rect x="210" y="70" width="148" height="160" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <rect x="210" y="70" width="148" height="32" rx="10" fill="#7F77DD"/>
  <rect x="210" y="88" width="148" height="14" fill="#7F77DD"/>
  <text x="284" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Phase 2</text>
  <text x="284" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">History</text>
  <text x="284" y="126" text-anchor="middle" font-size="10" fill="#534AB7">One question per screen</text>
  <text x="284" y="141" text-anchor="middle" font-size="10" fill="#534AB7">Yes/No · Choice · Number</text>
  <text x="284" y="156" text-anchor="middle" font-size="10" fill="#534AB7">Skip available</text>
  <rect x="226" y="170" width="116" height="48" rx="6" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.7"/>
  <text x="284" y="189" text-anchor="middle" font-size="10" fill="#26215C" font-weight="500">assert:</text>
  <text x="284" y="204" text-anchor="middle" font-size="10" fill="#26215C" font-family="monospace">symptom(Name,</text>
  <text x="284" y="218" text-anchor="middle" font-size="10" fill="#26215C" font-family="monospace">  Value)</text>

  <!-- Arrow 2→3 -->
  <line x1="358" y1="152" x2="378" y2="152" stroke="#8496c0" stroke-width="1.5" marker-end="url(#arrFlow)"/>

  <!-- Phase 3 -->
  <rect x="380" y="70" width="148" height="160" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
  <rect x="380" y="70" width="148" height="32" rx="10" fill="#639922"/>
  <rect x="380" y="88" width="148" height="14" fill="#639922"/>
  <text x="454" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Phase 3</text>
  <text x="454" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#173404">Examination</text>
  <text x="454" y="126" text-anchor="middle" font-size="10" fill="#3B6D11">Clinical findings</text>
  <text x="454" y="141" text-anchor="middle" font-size="10" fill="#3B6D11">Yes/No · Choice</text>
  <text x="454" y="156" text-anchor="middle" font-size="10" fill="#3B6D11">Skip available</text>
  <rect x="396" y="170" width="116" height="48" rx="6" fill="#C0DD97" stroke="#639922" stroke-width="0.7"/>
  <text x="454" y="189" text-anchor="middle" font-size="10" fill="#173404" font-weight="500">assert:</text>
  <text x="454" y="204" text-anchor="middle" font-size="10" fill="#173404" font-family="monospace">finding(Name,</text>
  <text x="454" y="218" text-anchor="middle" font-size="10" fill="#173404" font-family="monospace">  Value)</text>

  <!-- Arrow 3→4 -->
  <line x1="528" y1="152" x2="548" y2="152" stroke="#8496c0" stroke-width="1.5" marker-end="url(#arrFlow)"/>

  <!-- Phase 4 -->
  <rect x="550" y="70" width="130" height="160" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <rect x="550" y="70" width="130" height="32" rx="10" fill="#BA7517"/>
  <rect x="550" y="88" width="130" height="14" fill="#BA7517"/>
  <text x="615" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Phase 4</text>
  <text x="615" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#412402">Diagnose</text>
  <text x="615" y="124" text-anchor="middle" font-size="10" fill="#633806">query diagnose/2</text>
  <text x="615" y="138" text-anchor="middle" font-size="10" fill="#633806">collect proof</text>
  <text x="615" y="152" text-anchor="middle" font-size="10" fill="#633806">rank + display</text>
  <text x="615" y="166" text-anchor="middle" font-size="10" fill="#633806">retract all facts</text>
  <rect x="566" y="178" width="98" height="42" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.7"/>
  <text x="615" y="195" text-anchor="middle" font-size="10" fill="#412402" font-weight="500">Prolog:</text>
  <text x="615" y="209" text-anchor="middle" font-size="10" fill="#412402" font-family="monospace">diagnose(D,F)</text>

  <!-- ── Prolog interaction detail (bottom) ── -->
  <rect x="40" y="252" width="640" height="162" rx="10" fill="#0f1629" stroke="#263662" stroke-width="1"/>

  <text x="60" y="274" font-size="10" font-weight="600" fill="#8496c0" letter-spacing="0.07em">BRIDGE QUERY CYCLE  (bridge.py)</text>

  <!-- Step 1 -->
  <rect x="56" y="284" width="136" height="118" rx="8" fill="#182240" stroke="#263662" stroke-width="0.8"/>
  <text x="124" y="302" text-anchor="middle" font-size="10" font-weight="600" fill="#7eb8f7">1. assert facts</text>
  <text x="124" y="318" text-anchor="middle" font-size="10" fill="#9fdfb0" font-family="monospace">assertz(</text>
  <text x="124" y="332" text-anchor="middle" font-size="10" fill="#9fdfb0" font-family="monospace">  symptom(...))</text>
  <text x="124" y="346" text-anchor="middle" font-size="10" fill="#9fdfb0" font-family="monospace">assertz(</text>
  <text x="124" y="360" text-anchor="middle" font-size="10" fill="#9fdfb0" font-family="monospace">  finding(...))</text>
  <text x="124" y="378" text-anchor="middle" font-size="10" fill="#8496c0" font-family="monospace">...</text>

  <line x1="192" y1="343" x2="212" y2="343" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrProlog)"/>

  <!-- Step 2 -->
  <rect x="214" y="284" width="136" height="118" rx="8" fill="#182240" stroke="#263662" stroke-width="0.8"/>
  <text x="282" y="302" text-anchor="middle" font-size="10" font-weight="600" fill="#7eb8f7">2. query KB</text>
  <text x="282" y="318" text-anchor="middle" font-size="10" fill="#f0ad55" font-family="monospace">diagnose(D, F)</text>
  <text x="282" y="334" text-anchor="middle" font-size="10" fill="#bcc5db">→ all solutions</text>
  <text x="282" y="350" text-anchor="middle" font-size="10" fill="#f0ad55" font-family="monospace">exclude_if(D, R)</text>
  <text x="282" y="366" text-anchor="middle" font-size="10" fill="#bcc5db">→ filter</text>
  <text x="282" y="382" text-anchor="middle" font-size="10" fill="#f0ad55" font-family="monospace">explain_step(D,S,R)</text>

  <line x1="350" y1="343" x2="370" y2="343" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrProlog)"/>

  <!-- Step 3 -->
  <rect x="372" y="284" width="136" height="118" rx="8" fill="#182240" stroke="#263662" stroke-width="0.8"/>
  <text x="440" y="302" text-anchor="middle" font-size="10" font-weight="600" fill="#7eb8f7">3. sort + return</text>
  <text x="440" y="320" text-anchor="middle" font-size="10" fill="#bcc5db">common first</text>
  <text x="440" y="336" text-anchor="middle" font-size="10" fill="#bcc5db">occasional next</text>
  <text x="440" y="352" text-anchor="middle" font-size="10" fill="#bcc5db">rare last</text>
  <text x="440" y="372" text-anchor="middle" font-size="10" fill="#9fdfb0" font-family="monospace">retractall(_)</text>
  <text x="440" y="387" text-anchor="middle" font-size="10" fill="#8496c0">KB stays stateless</text>

  <line x1="508" y1="343" x2="528" y2="343" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrProlog)"/>

  <!-- Step 4 -->
  <rect x="530" y="284" width="134" height="118" rx="8" fill="#182240" stroke="#263662" stroke-width="0.8"/>
  <text x="597" y="302" text-anchor="middle" font-size="10" font-weight="600" fill="#7eb8f7">4. render UI</text>
  <text x="597" y="320" text-anchor="middle" font-size="10" fill="#bcc5db">freq. colour badge</text>
  <text x="597" y="336" text-anchor="middle" font-size="10" fill="#bcc5db">proof trace panel</text>
  <text x="597" y="352" text-anchor="middle" font-size="10" fill="#bcc5db">exclusion notice</text>
  <text x="597" y="368" text-anchor="middle" font-size="10" fill="#bcc5db">investigation chips</text>
  <text x="597" y="384" text-anchor="middle" font-size="10" fill="#bcc5db">session fact dump</text>

</svg>

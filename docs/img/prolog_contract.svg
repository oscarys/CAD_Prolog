<svg width="720" height="560" viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <rect width="720" height="560" fill="#f8f9fc" rx="12"/>

  <text x="360" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1629">Prolog predicate contract</text>
  <text x="360" y="52" text-anchor="middle" font-size="11" fill="#8496c0">Bridge provides dynamic facts · Students implement the five predicate families</text>

  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── LEFT: Bridge provides ── -->
  <rect x="40" y="68" width="280" height="242" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
  <text x="60" y="92" font-size="10" font-weight="600" fill="#26215C" letter-spacing="0.07em">BRIDGE PROVIDES (dynamic facts)</text>
  <text x="60" y="107" font-size="10" fill="#3C3489">asserted before each query · retracted after</text>

  <rect x="56" y="118" width="248" height="38" rx="7" fill="#AFA9EC" stroke="#7F77DD" stroke-width="0.8"/>
  <text x="180" y="133" text-anchor="middle" font-size="12" font-weight="600" fill="#26215C" font-family="monospace">patient_age(Age)</text>
  <text x="180" y="149" text-anchor="middle" font-size="10" fill="#3C3489">integer — years</text>

  <rect x="56" y="162" width="248" height="38" rx="7" fill="#AFA9EC" stroke="#7F77DD" stroke-width="0.8"/>
  <text x="180" y="177" text-anchor="middle" font-size="12" font-weight="600" fill="#26215C" font-family="monospace">patient_sex(Sex)</text>
  <text x="180" y="193" text-anchor="middle" font-size="10" fill="#3C3489">male | female</text>

  <rect x="56" y="206" width="248" height="38" rx="7" fill="#AFA9EC" stroke="#7F77DD" stroke-width="0.8"/>
  <text x="180" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#26215C" font-family="monospace">symptom(Name, Value)</text>
  <text x="180" y="237" text-anchor="middle" font-size="10" fill="#3C3489">atom · yes | no | choice | number</text>

  <rect x="56" y="250" width="248" height="38" rx="7" fill="#AFA9EC" stroke="#7F77DD" stroke-width="0.8"/>
  <text x="180" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#26215C" font-family="monospace">finding(Name, Value)</text>
  <text x="180" y="281" text-anchor="middle" font-size="10" fill="#3C3489">examination findings</text>

  <!-- Arrow bridge → student -->
  <line x1="320" y1="190" x2="358" y2="190" stroke="#7F77DD" stroke-width="1.8" marker-end="url(#arrC)"/>
  <text x="338" y="183" text-anchor="middle" font-size="9" fill="#534AB7">calls</text>

  <!-- ── RIGHT: Students implement ── -->
  <rect x="360" y="68" width="320" height="360" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="380" y="92" font-size="10" font-weight="600" fill="#412402" letter-spacing="0.07em">STUDENTS IMPLEMENT</text>
  <text x="380" y="107" font-size="10" fill="#633806">one .pl file per body system</text>

  <rect x="376" y="118" width="288" height="46" rx="7" fill="#EF9F27" stroke="#BA7517" stroke-width="0.8"/>
  <text x="520" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#412402" font-family="monospace">diagnose(Diagnosis, Frequency)</text>
  <text x="520" y="154" text-anchor="middle" font-size="10" fill="#633806">core rule — one clause per clinical picture</text>

  <rect x="376" y="172" width="288" height="46" rx="7" fill="#FAC775" stroke="#BA7517" stroke-width="0.8"/>
  <text x="520" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#412402" font-family="monospace">frequency(Diagnosis, Weight)</text>
  <text x="520" y="208" text-anchor="middle" font-size="10" fill="#633806">common | occasional | rare</text>

  <rect x="376" y="226" width="288" height="46" rx="7" fill="#FAC775" stroke="#BA7517" stroke-width="0.8"/>
  <text x="520" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#412402" font-family="monospace">suggest_test(Diagnosis, Test)</text>
  <text x="520" y="262" text-anchor="middle" font-size="10" fill="#633806">general + specific investigations</text>

  <rect x="376" y="280" width="288" height="46" rx="7" fill="#FAC775" stroke="#BA7517" stroke-width="0.8"/>
  <text x="520" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#412402" font-family="monospace">explain_step(Dx, Symptom, Why)</text>
  <text x="520" y="316" text-anchor="middle" font-size="10" fill="#633806">proof trace — one clause per symptom</text>

  <rect x="376" y="334" width="288" height="46" rx="7" fill="#FAC775" stroke="#BA7517" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="520" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#412402" font-family="monospace">exclude_if(Diagnosis, Reason)</text>
  <text x="520" y="370" text-anchor="middle" font-size="10" fill="#633806">optional · hard exclusion rules</text>

  <!-- Arrow students → output -->
  <line x1="360" y1="310" x2="322" y2="310" stroke="#BA7517" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="340" y="303" text-anchor="middle" font-size="9" fill="#854F0B">yields</text>

  <!-- ── BOTTOM LEFT: Bridge collects ── -->
  <rect x="40" y="326" width="280" height="100" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="60" y="348" font-size="10" font-weight="600" fill="#04342C" letter-spacing="0.07em">BRIDGE COLLECTS AND RETURNS</text>
  <rect x="56" y="358" width="248" height="28" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.7"/>
  <text x="180" y="377" text-anchor="middle" font-size="11" fill="#04342C">ranked list of (Diagnosis, Frequency)</text>
  <rect x="56" y="392" width="248" height="28" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.7"/>
  <text x="180" y="411" text-anchor="middle" font-size="11" fill="#04342C">proof trace + investigations per dx</text>

  <!-- ── Example rule box ── -->
  <rect x="40" y="444" width="640" height="100" rx="10" fill="#0f1629" stroke="#263662" stroke-width="1"/>
  <text x="60" y="464" font-size="10" font-weight="500" fill="#8496c0" letter-spacing="0.07em">EXAMPLE — chest_pain.pl</text>
  <text x="60" y="484" font-size="12" fill="#7eb8f7" font-family="monospace">diagnose</text>
  <text x="132" y="484" font-size="12" fill="#bcc5db" font-family="monospace">(angina, Frequency) :-</text>
  <text x="76" y="500" font-size="12" fill="#f0ad55" font-family="monospace">symptom</text>
  <text x="140" y="500" font-size="12" fill="#bcc5db" font-family="monospace">(chest_pain, </text>
  <text x="277" y="500" font-size="12" fill="#9fdfb0" font-family="monospace">yes</text>
  <text x="306" y="500" font-size="12" fill="#bcc5db" font-family="monospace">),  </text>
  <text x="340" y="500" font-size="12" fill="#f0ad55" font-family="monospace">symptom</text>
  <text x="404" y="500" font-size="12" fill="#bcc5db" font-family="monospace">(exertional, </text>
  <text x="520" y="500" font-size="12" fill="#9fdfb0" font-family="monospace">yes</text>
  <text x="549" y="500" font-size="12" fill="#bcc5db" font-family="monospace">),</text>
  <text x="76" y="516" font-size="12" fill="#7eb8f7" font-family="monospace">frequency</text>
  <text x="156" y="516" font-size="12" fill="#bcc5db" font-family="monospace">(angina, Frequency).</text>
  <text x="60" y="534" font-size="12" fill="#7eb8f7" font-family="monospace">explain_step</text>
  <text x="163" y="534" font-size="12" fill="#bcc5db" font-family="monospace">(angina, chest_pain, </text>
  <text x="380" y="534" font-size="12" fill="#f5c47a" font-family="monospace">'Crushing pain = myocardial ischaemia'</text>
  <text x="659" y="534" font-size="12" fill="#bcc5db" font-family="monospace">).</text>

</svg>

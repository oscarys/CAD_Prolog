<svg width="720" height="580" viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <rect width="720" height="580" fill="#f8f9fc" rx="12"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1629" letter-spacing="0.01em">System architecture</text>
  <text x="360" y="54" text-anchor="middle" font-size="11" fill="#8496c0">Three layers — scaffold (teaching team) + knowledge base (students)</text>

  <!-- ── LAYER 1: WEB FRONTEND ── -->
  <!-- Outer container -->
  <rect x="40" y="72" width="640" height="130" rx="12" fill="#e1f5ee" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="64" y="96" font-size="10" font-weight="600" fill="#085041" letter-spacing="0.08em">LAYER 1 — WEB FRONTEND</text>
  <text x="64" y="111" font-size="10" fill="#0F6E56">Flask · HTML/JS · built by teaching team</text>

  <!-- 4 inner boxes -->
  <rect x="60" y="120" width="134" height="68" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="127" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Patient intake</text>
  <text x="127" y="161" text-anchor="middle" font-size="10" fill="#085041">Age · sex</text>
  <text x="127" y="175" text-anchor="middle" font-size="10" fill="#085041">presentation</text>

  <rect x="210" y="120" width="134" height="68" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="277" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Symptom questions</text>
  <text x="277" y="161" text-anchor="middle" font-size="10" fill="#085041">Guided yes/no</text>
  <text x="277" y="175" text-anchor="middle" font-size="10" fill="#085041">choice · number</text>

  <rect x="360" y="120" width="134" height="68" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="427" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Results panel</text>
  <text x="427" y="161" text-anchor="middle" font-size="10" fill="#085041">Ranked differential</text>
  <text x="427" y="175" text-anchor="middle" font-size="10" fill="#085041">diagnoses</text>

  <rect x="510" y="120" width="150" height="68" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="585" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Proof trace panel</text>
  <text x="585" y="161" text-anchor="middle" font-size="10" fill="#085041">explain_step/3</text>
  <text x="585" y="175" text-anchor="middle" font-size="10" fill="#085041">rendered per diagnosis</text>

  <!-- ── Arrows layer 1 ↔ 2 ── -->
  <line x1="200" y1="214" x2="200" y2="268" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="208" y="246" font-size="10" fill="#534AB7">POST /query</text>
  <line x1="490" y1="268" x2="490" y2="214" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="498" y="246" font-size="10" fill="#534AB7">JSON results</text>

  <!-- ── LAYER 2: PYTHON BRIDGE ── -->
  <rect x="40" y="268" width="640" height="130" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
  <text x="64" y="292" font-size="10" font-weight="600" fill="#26215C" letter-spacing="0.08em">LAYER 2 — PYTHON / PYSWIP BRIDGE</text>
  <text x="64" y="307" font-size="10" fill="#3C3489">bridge.py · session.py · built by teaching team</text>

  <rect x="60" y="316" width="138" height="68" rx="8" fill="#AFA9EC" stroke="#7F77DD" stroke-width="0.8"/>
  <text x="129" y="341" text-anchor="middle" font-size="12" font-weight="600" fill="#26215C">Flask routes</text>
  <text x="129" y="357" text-anchor="middle" font-size="10" fill="#3C3489">4 phases · session</text>
  <text x="129" y="371" text-anchor="middle" font-size="10" fill="#3C3489">state management</text>

  <rect x="214" y="316" width="138" height="68" rx="8" fill="#AFA9EC" stroke="#7F77DD" stroke-width="0.8"/>
  <text x="283" y="341" text-anchor="middle" font-size="12" font-weight="600" fill="#26215C">Fact asserter</text>
  <text x="283" y="357" text-anchor="middle" font-size="10" fill="#3C3489">symptom/2</text>
  <text x="283" y="371" text-anchor="middle" font-size="10" fill="#3C3489">finding/2 · patient_*</text>

  <rect x="368" y="316" width="138" height="68" rx="8" fill="#AFA9EC" stroke="#7F77DD" stroke-width="0.8"/>
  <text x="437" y="341" text-anchor="middle" font-size="12" font-weight="600" fill="#26215C">PySwip caller</text>
  <text x="437" y="357" text-anchor="middle" font-size="10" fill="#3C3489">diagnose/2 query</text>
  <text x="437" y="371" text-anchor="middle" font-size="10" fill="#3C3489">proof collector</text>

  <rect x="522" y="316" width="138" height="68" rx="8" fill="#AFA9EC" stroke="#7F77DD" stroke-width="0.8"/>
  <text x="591" y="341" text-anchor="middle" font-size="12" font-weight="600" fill="#26215C">Result ranker</text>
  <text x="591" y="357" text-anchor="middle" font-size="10" fill="#3C3489">common → occasional</text>
  <text x="591" y="371" text-anchor="middle" font-size="10" fill="#3C3489">→ rare sort</text>

  <!-- ── Arrows layer 2 ↔ 3 ── -->
  <line x1="200" y1="410" x2="200" y2="458" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="208" y="440" font-size="10" fill="#854F0B">assert/retract</text>
  <line x1="490" y1="458" x2="490" y2="410" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="498" y="440" font-size="10" fill="#854F0B">bindings</text>

  <!-- ── LAYER 3: PROLOG KB ── -->
  <rect x="40" y="458" width="640" height="104" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="64" y="482" font-size="10" font-weight="600" fill="#412402" letter-spacing="0.08em">LAYER 3 — PROLOG KNOWLEDGE BASE</text>
  <text x="64" y="497" font-size="10" fill="#633806">SWI-Prolog .pl modules · built by students</text>

  <rect x="60" y="508" width="140" height="44" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.8"/>
  <text x="130" y="527" text-anchor="middle" font-size="11" font-weight="600" fill="#412402">frequency/2</text>
  <text x="130" y="543" text-anchor="middle" font-size="10" fill="#633806">common · occasional · rare</text>

  <rect x="216" y="508" width="140" height="44" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.8"/>
  <text x="286" y="527" text-anchor="middle" font-size="11" font-weight="600" fill="#412402">diagnose/2</text>
  <text x="286" y="543" text-anchor="middle" font-size="10" fill="#633806">core rule bodies</text>

  <rect x="372" y="508" width="140" height="44" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.8"/>
  <text x="442" y="527" text-anchor="middle" font-size="11" font-weight="600" fill="#412402">explain_step/3</text>
  <text x="442" y="543" text-anchor="middle" font-size="10" fill="#633806">proof trace clauses</text>

  <rect x="528" y="508" width="132" height="44" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.8"/>
  <text x="594" y="527" text-anchor="middle" font-size="11" font-weight="600" fill="#412402">suggest_test/2</text>
  <text x="594" y="543" text-anchor="middle" font-size="10" fill="#633806">investigations</text>

  <!-- Legend -->
  <rect x="40" y="574" width="4" height="0" fill="none"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

</svg>

<svg width="720" height="570" viewBox="0 0 720 570" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <rect width="720" height="570" fill="#f8f9fc" rx="12"/>

  <text x="360" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1629">18 high-yield presentations</text>
  <text x="360" y="52" text-anchor="middle" font-size="11" fill="#8496c0">6 body systems · each maps to one Prolog module</text>

  <!-- ── CARDIOVASCULAR (coral) ── -->
  <rect x="40" y="68" width="198" height="148" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="60" y="90" font-size="10" font-weight="600" fill="#4A1B0C" letter-spacing="0.07em">CARDIOVASCULAR</text>
  <rect x="56" y="100" width="166" height="28" rx="6" fill="#F0997B" stroke="#D85A30" stroke-width="0.7"/>
  <text x="139" y="119" text-anchor="middle" font-size="12" fill="#4A1B0C" font-weight="500">Chest pain</text>
  <rect x="56" y="134" width="166" height="28" rx="6" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.7"/>
  <text x="139" y="153" text-anchor="middle" font-size="12" fill="#4A1B0C">Palpitations</text>
  <rect x="56" y="168" width="166" height="28" rx="6" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.7"/>
  <text x="139" y="187" text-anchor="middle" font-size="12" fill="#4A1B0C">Syncope</text>

  <!-- ── RESPIRATORY (blue) ── -->
  <rect x="258" y="68" width="204" height="148" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="278" y="90" font-size="10" font-weight="600" fill="#042C53" letter-spacing="0.07em">RESPIRATORY</text>
  <rect x="274" y="100" width="172" height="28" rx="6" fill="#85B7EB" stroke="#378ADD" stroke-width="0.7"/>
  <text x="360" y="119" text-anchor="middle" font-size="12" fill="#042C53" font-weight="500">Dyspnoea</text>
  <rect x="274" y="134" width="172" height="28" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.7"/>
  <text x="360" y="153" text-anchor="middle" font-size="12" fill="#042C53">Cough / haemoptysis</text>
  <rect x="274" y="168" width="172" height="28" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.7"/>
  <text x="360" y="187" text-anchor="middle" font-size="12" fill="#042C53">Stridor</text>

  <!-- ── GASTROINTESTINAL (teal) ── -->
  <rect x="482" y="68" width="198" height="182" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="502" y="90" font-size="10" font-weight="600" fill="#04342C" letter-spacing="0.07em">GASTROINTESTINAL</text>
  <rect x="498" y="100" width="166" height="28" rx="6" fill="#5DCAA5" stroke="#1D9E75" stroke-width="0.7"/>
  <text x="581" y="119" text-anchor="middle" font-size="12" fill="#04342C" font-weight="500">Abdominal pain</text>
  <rect x="498" y="134" width="166" height="28" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.7"/>
  <text x="581" y="153" text-anchor="middle" font-size="12" fill="#04342C">Jaundice</text>
  <rect x="498" y="168" width="166" height="28" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.7"/>
  <text x="581" y="187" text-anchor="middle" font-size="12" fill="#04342C">Haematemesis</text>
  <rect x="498" y="202" width="166" height="28" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.7"/>
  <text x="581" y="221" text-anchor="middle" font-size="12" fill="#04342C">Diarrhoea</text>

  <!-- ── NEUROLOGICAL (purple) ── -->
  <rect x="40" y="234" width="198" height="148" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="60" y="256" font-size="10" font-weight="600" fill="#26215C" letter-spacing="0.07em">NEUROLOGICAL</text>
  <rect x="56" y="266" width="166" height="28" rx="6" fill="#AFA9EC" stroke="#7F77DD" stroke-width="0.7"/>
  <text x="139" y="285" text-anchor="middle" font-size="12" fill="#26215C" font-weight="500">Headache</text>
  <rect x="56" y="300" width="166" height="28" rx="6" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.7"/>
  <text x="139" y="319" text-anchor="middle" font-size="12" fill="#26215C">Convulsions</text>
  <rect x="56" y="334" width="166" height="28" rx="6" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.7"/>
  <text x="139" y="353" text-anchor="middle" font-size="12" fill="#26215C">Coma / confusion</text>

  <!-- ── SYSTEMIC (amber) ── -->
  <rect x="258" y="234" width="204" height="148" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="278" y="256" font-size="10" font-weight="600" fill="#412402" letter-spacing="0.07em">SYSTEMIC</text>
  <rect x="274" y="266" width="172" height="28" rx="6" fill="#EF9F27" stroke="#BA7517" stroke-width="0.7"/>
  <text x="360" y="285" text-anchor="middle" font-size="12" fill="#412402" font-weight="500">Pyrexia of unknown origin</text>
  <rect x="274" y="300" width="172" height="28" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.7"/>
  <text x="360" y="319" text-anchor="middle" font-size="12" fill="#412402">Weight loss</text>
  <rect x="274" y="334" width="172" height="28" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.7"/>
  <text x="360" y="353" text-anchor="middle" font-size="12" fill="#412402">Shock</text>

  <!-- ── UROGENITAL / ENDOCRINE (green) ── -->
  <rect x="482" y="268" width="198" height="148" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="502" y="290" font-size="10" font-weight="600" fill="#173404" letter-spacing="0.07em">UROGENITAL / ENDOCRINE</text>
  <rect x="498" y="300" width="166" height="28" rx="6" fill="#97C459" stroke="#639922" stroke-width="0.7"/>
  <text x="581" y="319" text-anchor="middle" font-size="12" fill="#173404" font-weight="500">Haematuria</text>
  <rect x="498" y="334" width="166" height="28" rx="6" fill="#C0DD97" stroke="#639922" stroke-width="0.7"/>
  <text x="581" y="353" text-anchor="middle" font-size="12" fill="#173404">Polyuria / thirst</text>
  <rect x="498" y="368" width="166" height="28" rx="6" fill="#C0DD97" stroke="#639922" stroke-width="0.7"/>
  <text x="581" y="387" text-anchor="middle" font-size="12" fill="#173404">Oedema</text>

  <!-- ── Frequency legend ── -->
  <rect x="40" y="404" width="640" height="60" rx="8" fill="#fff" stroke="#dde1ec" stroke-width="1"/>
  <text x="360" y="424" text-anchor="middle" font-size="11" font-weight="600" fill="#4a5578">Churchill's frequency colour coding → Prolog frequency/2 atom</text>
  <circle cx="120" cy="447" r="7" fill="#2d9e6b"/>
  <text x="133" y="452" font-size="11" fill="#0f1629">Common</text>
  <circle cx="260" cy="447" r="7" fill="#d97a2a"/>
  <text x="273" y="452" font-size="11" fill="#0f1629">Occasional</text>
  <circle cx="410" cy="447" r="7" fill="#c94040"/>
  <text x="423" y="452" font-size="11" fill="#0f1629">Rare</text>
  <text x="560" y="452" font-size="11" fill="#8496c0">one .pl file per system</text>

  <!-- ── Exam script phase strip ── -->
  <rect x="40" y="482" width="640" height="72" rx="8" fill="#fff" stroke="#dde1ec" stroke-width="1"/>
  <text x="360" y="502" text-anchor="middle" font-size="11" font-weight="600" fill="#4a5578">Exam script — 4 phases per presentation</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8496c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="60" y="512" width="118" height="32" rx="6" fill="#e8ecf4" stroke="#bfc6d8" stroke-width="0.8"/>
  <text x="119" y="533" text-anchor="middle" font-size="11" fill="#0f1629" font-weight="500">1. Demographics</text>
  <line x1="178" y1="528" x2="198" y2="528" stroke="#8496c0" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="200" y="512" width="108" height="32" rx="6" fill="#e8ecf4" stroke="#bfc6d8" stroke-width="0.8"/>
  <text x="254" y="533" text-anchor="middle" font-size="11" fill="#0f1629" font-weight="500">2. History</text>
  <line x1="308" y1="528" x2="328" y2="528" stroke="#8496c0" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="330" y="512" width="120" height="32" rx="6" fill="#e8ecf4" stroke="#bfc6d8" stroke-width="0.8"/>
  <text x="390" y="533" text-anchor="middle" font-size="11" fill="#0f1629" font-weight="500">3. Examination</text>
  <line x1="450" y1="528" x2="470" y2="528" stroke="#8496c0" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="472" y="512" width="208" height="32" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="576" y="529" text-anchor="middle" font-size="11" fill="#04342C" font-weight="600">4. Diagnose + proof trace</text>
  <text x="576" y="542" text-anchor="middle" font-size="10" fill="#085041">Prolog inference · explain_step/3</text>

</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía de práctica CAD — Mr. Carlos Mendoza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --navy-950: #0a0f1e; --navy-900: #0f1629; --navy-800: #182240;
  --navy-700: #1e2d52; --navy-600: #263662; --navy-400: #3d518a;
  --navy-200: #8496c0; --navy-100: #bcc5db; --navy-50: #e8ecf4;
  --amber: #e8993a; --amber-l: #f5c47a; --amber-dim: #fdf0d8;
  --green: #2d9e6b; --green-l: #d4f0e4;
  --orange: #d97a2a; --orange-l: #fce9d0;
  --red: #c94040; --red-l: #fad8d8;
  --teal: #1D9E75; --teal-l: #E1F5EE;
  --surface: #ffffff; --bg: #f5f6f9; --border: #dde1ec;
  --text: #0f1629; --muted: #4a5578; --hint: #8496c0;
  --font-serif: 'DM Serif Display', Georgia, serif;
  --font-sans: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --r: 10px; --r-lg: 16px;
  --shadow: 0 2px 12px rgba(10,15,30,.08), 0 0 0 1px rgba(10,15,30,.06);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Header ── */
.hdr { background: var(--navy-900); border-bottom: 1px solid var(--navy-700); padding: 0 32px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.hdr-brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { font-family: var(--font-serif); font-style: italic; font-size: 18px; color: var(--amber); background: var(--navy-800); border: 1px solid var(--navy-600); width: 42px; height: 34px; display: grid; place-items: center; border-radius: 6px; }
.brand-name { font-size: 13px; font-weight: 500; color: #fff; }
.hdr-meta { font-size: 12px; color: var(--navy-200); }
.hdr-divider { width:1px; height:28px; background:var(--navy-600); margin:0 14px; flex-shrink:0; }
.uam-logo { height:30px; width:auto; filter:invert(1) brightness(0.88); opacity:.9; }

/* ── Step rail ── */
.layout { display: flex; min-height: calc(100vh - 56px); }
.rail { width: 200px; background: var(--navy-900); border-right: 1px solid var(--navy-700); padding: 28px 0; flex-shrink: 0; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
.rail-step { display: flex; align-items: center; gap: 10px; padding: 9px 18px; cursor: pointer; transition: background .15s; }
.rail-step:hover { background: rgba(255,255,255,.04); }
.rail-step.active { background: rgba(232,153,58,.1); }
.step-dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--navy-600); display: grid; place-items: center; flex-shrink: 0; font-size: 10px; color: var(--navy-200); font-weight: 500; transition: all .2s; }
.rail-step.done .step-dot { background: var(--green); border-color: var(--green); color: #fff; }
.rail-step.active .step-dot { background: var(--amber); border-color: var(--amber); color: var(--navy-950); font-weight: 700; }
.step-label { font-size: 12px; color: var(--navy-100); line-height: 1.3; }
.rail-step.active .step-label { color: #fff; }
.rail-conn { width: 1.5px; height: 14px; background: var(--navy-700); margin-left: 28px; }
.rail-conn.done { background: rgba(45,158,107,.4); }

/* ── Content ── */
.content { flex: 1; padding: 40px 48px; max-width: 860px; }

.slide { display: none; animation: fadeUp .3s ease; }
.slide.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ── Phase badge ── */
.phase-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 100px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 12px; }
.badge-intro { background: var(--navy-50); color: var(--navy-700); }
.badge-p1 { background: #e8f0fd; color: #185FA5; }
.badge-p2 { background: var(--navy-50); color: var(--navy-700); }
.badge-p3 { background: var(--green-l); color: #085041; }
.badge-p4 { background: var(--amber-dim); color: #633806; }
.badge-learn { background: var(--teal-l); color: #04342C; }

/* ── Slide headings ── */
.slide-title { font-family: var(--font-serif); font-size: 30px; font-style: italic; color: var(--navy-900); line-height: 1.25; margin-bottom: 8px; }
.slide-sub { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; max-width: 600px; }

/* ── Case card ── */
.case-card { background: var(--navy-900); border: 1px solid var(--navy-700); border-radius: var(--r-lg); padding: 28px 32px; margin-bottom: 24px; }
.case-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); font-family: var(--font-mono); margin-bottom: 12px; }
.case-patient { font-family: var(--font-serif); font-size: 22px; font-style: italic; color: #fff; margin-bottom: 16px; }
.case-body { font-size: 14px; color: var(--navy-100); line-height: 1.75; }
.case-body strong { color: var(--amber-l); font-weight: 500; }

/* ── Exam question mockup ── */
.q-mockup { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 28px 32px; box-shadow: var(--shadow); margin-bottom: 16px; }
.q-icon { width: 40px; height: 40px; border-radius: var(--r); display: grid; place-items: center; margin-bottom: 16px; }
.q-icon-hist { background: #e8f0fd; color: #185FA5; }
.q-icon-exam { background: var(--green-l); color: var(--green); }
.q-text { font-family: var(--font-serif); font-size: 20px; font-style: italic; color: var(--navy-900); margin-bottom: 20px; line-height: 1.35; }
.q-answers { display: flex; gap: 10px; flex-wrap: wrap; }
.q-answer { padding: 9px 20px; border: 2px solid var(--border); border-radius: 100px; font-size: 13px; color: var(--muted); background: var(--surface); }
.q-answer.selected { border-color: var(--navy-700); background: var(--navy-900); color: #fff; font-weight: 500; }
.q-answer.choice { border-radius: var(--r); }
.q-atom { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding: 8px 12px; background: var(--navy-950); border-radius: 6px; opacity: .7; }
.q-atom-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--amber); font-family: var(--font-mono); }
.q-atom-code { font-size: 11px; color: #9fdfb0; font-family: var(--font-mono); }

/* ── Answer table ── */
.answer-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
.answer-table th { text-align: left; padding: 8px 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--hint); border-bottom: 2px solid var(--border); }
.answer-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
.answer-table tr:last-child td { border-bottom: none; }
.answer-table td:nth-child(2) { font-weight: 500; color: var(--navy-900); }
.answer-table td:nth-child(3) { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.answer-table tr.key-row td { background: rgba(232,153,58,.06); }
.answer-table tr.key-row td:nth-child(2) { color: #633806; }

/* ── Results mockup ── */
.results-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.dx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); }
.dx-card.common  { border-left: 3px solid var(--green); }
.dx-card.excluded { border-left: 3px solid var(--red); opacity: .65; border-style: solid solid solid dashed; }
.dx-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
.dx-left { display: flex; align-items: center; gap: 10px; }
.dx-pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pip-common { background: var(--green); }
.pip-excl   { background: var(--red); }
.dx-name { font-size: 16px; font-weight: 500; }
.dx-name.struck { text-decoration: line-through; color: var(--hint); }
.excl-tag { font-size: 11px; padding: 2px 8px; background: var(--red-l); color: var(--red); border-radius: 100px; }
.freq-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.freq-common { color: var(--green); }
.freq-excl   { color: var(--red); }
.excl-reason { padding: 0 20px 14px; font-size: 13px; color: var(--red); font-style: italic; display: flex; align-items: flex-start; gap: 6px; }

/* ── Proof trace ── */
.proof-panel { background: var(--navy-950); border-top: 1px solid var(--navy-800); padding: 20px 24px; }
.proof-hdr { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--amber); font-family: var(--font-mono); margin-bottom: 14px; }
.proof-step { display: flex; gap: 0; margin-bottom: 4px; }
.proof-bar { width: 1px; background: var(--navy-700); margin: 0 16px 0 8px; flex-shrink: 0; }
.proof-body { flex: 1; padding: 8px 0 8px; color: #bcc5db; }
.proof-atom { font-family: var(--font-mono); font-size: 12px; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.p-pred { color: #7eb8f7; } .p-paren { color: var(--navy-200); }
.p-sym  { color: #f0ad55; } .p-val  { color: #9fdfb0; }
.p-arr  { color: #6b7fa3; margin: 0 6px; }
.p-dx   { color: #c9a6f5; }
.proof-rat { font-size: 12px; color: var(--navy-100); font-style: italic; line-height: 1.5; }
.proof-conclusion { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 12px 14px; background: rgba(232,153,58,.08); border: 1px solid rgba(232,153,58,.2); border-radius: 8px; }
.proof-therefore { font-size: 16px; color: var(--amber); }
.proof-code { font-family: var(--font-mono); font-size: 12px; color: var(--amber-l); }
.tests-row { border-top: 1px solid var(--navy-800); padding: 14px 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tests-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--navy-200); font-family: var(--font-mono); margin-right: 4px; }
.test-chip { padding: 3px 9px; background: var(--navy-800); border: 1px solid var(--navy-600); border-radius: 100px; font-size: 11px; color: var(--navy-100); font-family: var(--font-mono); }

/* ── Prolog rule box ── */
.rule-box { background: var(--navy-950); border: 1px solid var(--navy-700); border-radius: var(--r-lg); padding: 20px 24px; margin-bottom: 16px; overflow-x: auto; }
.rule-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--amber); font-family: var(--font-mono); margin-bottom: 12px; }
.rule-code { font-family: var(--font-mono); font-size: 12px; line-height: 1.9; white-space: nowrap; color: #bcc5db; }
.r-pred    { color: #7eb8f7; }
.r-atom    { color: #f0ad55; }
.r-val     { color: #9fdfb0; }
.r-op      { color: #8496c0; }
.r-comment { color: #6b7fa3; font-style: italic; }
.r-fail    { color: #f09595; font-weight: 500; }
.r-pass    { color: #5dcaa5; }

/* ── Callout box ── */
.callout { border-radius: var(--r); padding: 14px 18px; margin-bottom: 16px; font-size: 13px; line-height: 1.65; }
.callout-amber { background: var(--amber-dim); border-left: 3px solid var(--amber); color: #412402; }
.callout-green { background: var(--green-l); border-left: 3px solid var(--green); color: #04342C; }
.callout-navy  { background: var(--navy-50); border-left: 3px solid var(--navy-400); color: var(--navy-800); }
.callout strong { font-weight: 600; }
.callout code  { font-family: var(--font-mono); font-size: 11px; background: rgba(0,0,0,.07); padding: 1px 5px; border-radius: 3px; }

/* ── Insight list ── */
.insight-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
.insight { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); }
.insight-num { width: 28px; height: 28px; border-radius: 50%; background: var(--navy-900); color: var(--amber); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; font-family: var(--font-mono); }
.insight-body { flex: 1; }
.insight-title { font-size: 14px; font-weight: 600; color: var(--navy-900); margin-bottom: 4px; }
.insight-text  { font-size: 13px; color: var(--muted); line-height: 1.6; }
.insight-text code { font-family: var(--font-mono); font-size: 11px; background: var(--navy-50); padding: 1px 5px; border-radius: 3px; }

/* ── Variant cards ── */
.variants { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
.variant { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); }
.variant-letter { font-family: var(--font-serif); font-size: 28px; font-style: italic; color: var(--navy-100); margin-bottom: 8px; }
.variant-title { font-size: 13px; font-weight: 600; color: var(--navy-900); margin-bottom: 6px; }
.variant-body  { font-size: 12px; color: var(--muted); line-height: 1.6; }
.variant-expect { font-size: 11px; font-family: var(--font-mono); color: var(--green); margin-top: 8px; }

/* ── Nav ── */
.nav { display: flex; align-items: center; justify-content: space-between; margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--border); }
.nav-info { font-size: 12px; color: var(--hint); }
.nav-btns { display: flex; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 22px; border-radius: var(--r); font-size: 14px; font-weight: 500; border: none; cursor: pointer; transition: all .15s; font-family: var(--font-sans); }
.btn-primary { background: var(--navy-900); color: #fff; }
.btn-primary:hover { background: var(--navy-700); }
.btn-primary:disabled { opacity: .3; pointer-events: none; }
.btn-ghost { background: var(--surface); color: var(--muted); border: 1.5px solid var(--border); }
.btn-ghost:hover { border-color: var(--navy-400); color: var(--text); }

/* ── Progress bar ── */
.progress-bar { height: 2px; background: var(--border); border-radius: 2px; margin-bottom: 32px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--amber); border-radius: 2px; transition: width .4s ease; }

/* ── Section heading ── */
.section-h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--hint); margin-bottom: 12px; }

/* ── Small helpers ── */
.mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
p { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 12px; }
p strong { color: var(--text); font-weight: 600; }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">
    <div class="brand-mark">aDx</div>
    <span class="brand-name">Diagnóstico Asistido — Guía de práctica</span>
    <div class="hdr-divider"></div>
    <img src="../frontend/static/uam_iztapalapa.png"
         alt="Universidad Autonoma Metropolitana Iztapalapa"
         class="uam-logo">
  </div>
  <span class="hdr-meta">Sr. Carlos Mendoza · dolor torácico · autoguiada</span>
</header>

<div class="layout">

  <!-- Step rail -->
  <aside class="rail" id="rail"></aside>

  <!-- Slides -->
  <main class="content">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div id="slides"></div>

    <div class="nav">
      <span class="nav-info" id="navInfo"></span>
      <div class="nav-btns">
        <button class="btn btn-ghost" id="prevBtn" onclick="go(-1)">← Atrás</button>
        <button class="btn btn-primary" id="nextBtn" onclick="go(1)">Siguiente →</button>
      </div>
    </div>
  </main>

</div>

<script>
const STEPS = [
  { label: "Introducción", sub: "El caso" },
  { label: "Fase 1", sub: "Datos demográficos" },
  { label: "Fase 2a", sub: "Síntomas clave" },
  { label: "Fase 2b", sub: "Síntomas negativos" },
  { label: "Fase 3", sub: "Exploración" },
  { label: "Fase 4a", sub: "Diagnósticos activos" },
  { label: "Fase 4b", sub: "Traza de demostración" },
  { label: "Fase 4c", sub: "exclude_if/2" },
  { label: "¿Por qué no angina?", sub: "Rastreo de reglas" },
  { label: "Puntos clave", sub: "Qué recordar" },
  { label: "Practícalo", sub: "Casos variantes" },
];

const SLIDES = [

/* 0 — Introduction */
`<div class="phase-badge badge-intro">Introducción al caso</div>
<h1 class="slide-title">Un hombre de 58 años con dolor torácico opresivo</h1>
<p class="slide-sub">Siga esta guía <strong>con la aplicación en ejecución</strong> at <code style="font-family:var(--font-mono);font-size:12px;background:var(--navy-50);padding:2px 6px;border-radius:4px">localhost:5000</code> en paralelo. Ingrese las respuestas indicadas en cada paso y observe lo que aparece en pantalla.</p>
<div class="case-card">
  <div class="case-label">Caso clínico — Sr. Carlos Mendoza</div>
  <div class="case-patient">58 años · masculino · servicio de urgencias</div>
  <div class="case-body">
    Ingresa sosteniéndose el pecho. Describe un dolor <strong>central, opresivo</strong> que inició <strong>hace 25 minutos</strong> mientras estaba sentado en su escritorio y que no ha cedido. El dolor <strong>irradia hacia el brazo izquierdo</strong>. Presenta <strong>diaforesis profusa</strong>.<br><br>
    Niega haber tenido síntomas con el esfuerzo antes de este episodio. Los antiácidos que tomó en la sala de espera <strong>no le dieron alivio</strong>.<br><br>
    En la exploración: pulso 102, TA 148/94. <strong>El ECG muestra elevación del ST en V2–V5</strong>. La troponina está <strong>pendiente</strong> (muestra tomada al ingreso). <strong>Pulsos iguales en las cuatro extremidades</strong>.
  </div>
</div>
<div class="callout callout-amber"><strong>Lo que observará:</strong> un diagnóstico dominante (IAM) con traza de seis pasos, ningún diagnóstico excluido en este caso (vea por qué en la Fase 4c), y un negativo explícito (la angina no aparece). Cada resultado es rastreable línea por línea hasta <code>chest_pain.pl</code>.</div>`,

/* 1 — Phase 1 */
`<div class="phase-badge badge-p1">Fase 1 — datos demográficos</div>
<h1 class="slide-title">Seleccione la presentación e ingrese los datos del paciente</h1>
<p class="slide-sub">Abra la aplicación. En la pantalla inicial, ingrese estos tres valores y haga clic en <strong>Iniciar interrogatorio</strong>.</p>
<div class="q-mockup">
  <div class="section-h">Motivo de consulta</div>
  <div class="q-answers" style="margin-bottom:20px">
    <span class="q-answer choice selected">Dolor torácico</span>
    <span class="q-answer choice">Palpitaciones</span>
    <span class="q-answer choice">Síncope</span>
  </div>
  <div class="section-h">Datos del paciente</div>
  <div style="display:flex;gap:24px;align-items:flex-end">
    <div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">Edad (años)</div>
    <div style="width:100px;height:44px;border:2px solid var(--navy-700);border-radius:8px;background:var(--navy-50);display:grid;place-items:center;font-size:20px;font-weight:300;color:var(--text)">58</div></div>
    <div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">Sexo</div>
    <div style="display:flex;gap:8px"><span class="q-answer selected" style="border-radius:8px;padding:10px 20px">Masculino</span><span class="q-answer" style="border-radius:8px;padding:10px 20px">Femenino</span></div></div>
  </div>
</div>
<div class="callout callout-navy"><strong>Lo que ocurre internamente:</strong> la sesión Flask almacena <code>presentation=chest_pain</code>, <code>age=58</code>, <code>sex=male</code>. Nada llega a Prolog todavía — el puente se ejecuta una sola vez, al final de la Fase 3.</div>`,

/* 2 — Phase 2a key symptoms */
`<div class="phase-badge badge-p2">Fase 2 — historia (respuestas clave)</div>
<h1 class="slide-title">Los síntomas que determinarán el diagnóstico</h1>
<p class="slide-sub">Estas seis respuestas son las más determinantes para este caso. Observe cómo cada una se mapea directamente a un átomo Prolog.</p>
<table class="answer-table">
<thead><tr><th>Pregunta</th><th>Respuesta</th><th>Prolog fact</th></tr></thead>
<tbody>
<tr class="key-row"><td>¿El paciente tiene dolor torácico?</td><td>Sí</td><td>symptom(chest_pain, yes)</td></tr>
<tr class="key-row"><td>¿Cómo describe el paciente el dolor?</td><td>Crushing / tight</td><td>symptom(pain_character, crushing)</td></tr>

/* 6 — Phase 4b proof trace anatomy */
`<div class="phase-badge badge-p4">Fase 4 — anatomía de la traza</div>
<h1 class="slide-title">Cómo se activó el IAM — dos reglas, un resultado</h1>
<p class="slide-sub">Abra <code style="font-family:var(--font-mono);font-size:12px;background:var(--navy-50);padding:2px 5px;border-radius:4px">prolog/modules/chest_pain.pl</code> y localice estas dos cláusulas. Ambas coincidieron con nuestro conjunto de síntomas de forma independiente.</p>
<div class="rule-box">
  <div class="rule-label">Regla 1 — basada en duración (líneas ~53–59)</div>
  <div class="rule-code">
    <span class="r-pred">diagnose</span>(myocardial_infarction, Frequency) :-<br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(chest_pain, <span class="r-val">yes</span>),&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="r-comment">% ✓ yes</span><br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(pain_character, <span class="r-val">crushing</span>),&nbsp;&nbsp;<span class="r-comment">% ✓ crushing</span><br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(exertional, <span class="r-val">no</span>),&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="r-comment">% ✓ no — ocurre en reposo</span><br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(pain_duration_minutes, D),&nbsp;<span class="r-comment">% D = 25</span><br>
    &nbsp;&nbsp;D >= 20,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="r-comment">% ✓ 25 >= 20</span><br>
    &nbsp;&nbsp;<span class="r-pred">frequency</span>(myocardial_infarction, Frequency).
  </div>
</div>
<div class="rule-box">
  <div class="rule-label">Regla 2 — tríada clásica (líneas ~61–66)</div>
  <div class="rule-code">
    <span class="r-pred">diagnose</span>(myocardial_infarction, Frequency) :-<br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(chest_pain, <span class="r-val">yes</span>),&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="r-comment">% ✓</span><br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(pain_character, <span class="r-val">crushing</span>),&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="r-comment">% ✓</span><br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(radiation_to_arm, <span class="r-val">yes</span>),&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="r-comment">% ✓</span><br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(sweating, <span class="r-val">yes</span>),&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="r-comment">% ✓</span><br>
    &nbsp;&nbsp;<span class="r-pred">frequency</span>(myocardial_infarction, Frequency).
  </div>
</div>
<div class="callout callout-navy"><strong>¿Por qué dos reglas?</strong> Estas son dos presentaciones clínicas genuinamente distintas del IAM. La Regla 1 captura el criterio temporal (dolor en reposo &gt;20 min). La Regla 2 captura la tríada clásica (opresivo + irradiación al brazo + sudoración), que puede ocurrir incluso con menor duración. Prolog retrocede a través de ambas cláusulas y encuentra dos soluciones — el <code>seen</code> del puente las deduplica en un resultado en pantalla.</div>`,

/* 7 — Phase 4c exclusions */
`<div class="phase-badge badge-p4">Fase 4 — exclusiones</div>
<h1 class="slide-title">Cómo funciona exclude_if/2 — y por qué no lo verá aquí</h1>
<p class="slide-sub">Para este caso <strong>no aparece ningún diagnóstico excluido</strong>. Eso es correcto. Aquí está la mecánica exacta.</p>
<div class="callout callout-amber"><strong>La regla clave:</strong> <code>exclude_if/2</code> solo se ejecuta sobre diagnósticos que <code>diagnose/2</code> ya produjo. Para el caso Mendoza, <code>diagnose/2</code> solo produjo <code>myocardial_infarction</code>. Ni <code>aortic_dissection</code> ni <code>depression</code> coincidieron con los síntomas asertados — el puente nunca llega a verificar sus exclusiones.</div>
<p>Las reglas de exclusión <em>sí existen</em> en <code>chest_pain.pl</code> y están correctamente escritas:</p>
<div class="rule-box">
  <div class="rule-label">exclude_if — disección aórtica (no se activa en este caso)</div>
  <div class="rule-code">
    <span class="r-pred">exclude_if</span>(aortic_dissection, <span class="r-atom">'Pulsos simétricos...'</span>) :-<br>
    &nbsp;&nbsp;<span class="r-pred">finding</span>(pulse_asymmetry, <span class="r-val">no</span>).
    &nbsp;&nbsp;<span class="r-comment">% condición presente, pero diagnose/2 no produjo este dx</span>
  </div>
</div>
<div class="rule-box">
  <div class="rule-label">exclude_if — depresión (no se activa en este caso)</div>
  <div class="rule-code">
    <span class="r-pred">exclude_if</span>(depression, <span class="r-atom">'Anomalía cardíaca objetiva...'</span>) :-<br>
    &nbsp;&nbsp;( <span class="r-pred">finding</span>(ecg_changes, <span class="r-val">yes</span>)&nbsp;<span class="r-op">;</span>&nbsp;<span class="r-pred">finding</span>(troponin_elevated, <span class="r-val">yes</span>) ).
  </div>
</div>
<div class="callout callout-green"><strong>Para verlo en acción:</strong> ejecute la <strong>Variante D</strong> (última diapositiva). En la Sesión D1, la depresión aparece como diagnóstico activo. En la Sesión D2, las mismas respuestas pero con ECG positivo activan <code>exclude_if/2</code> y la depresión desaparece — excluida porque hay una anomalía cardíaca objetiva.</div>`,

/* 8 — Why not angina */
`<div class="phase-badge badge-p4">Fase 4 — rastreo de reglas</div>
<h1 class="slide-title">Por qué la angina no aparece</h1>
<p class="slide-sub">La angina no aparece — no está excluida, simplemente nunca es producida por <code style="font-family:var(--font-mono);font-size:12px;background:var(--navy-50);padding:2px 5px;border-radius:4px">diagnose/2</code>. Esta es la razón exacta.</p>
<div class="rule-box">
  <div class="rule-label">diagnose(angina, ...) — rastreo objetivo por objetivo</div>
  <div class="rule-code">
    <span class="r-pred">diagnose</span>(angina, Frequency) :-<br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(chest_pain, <span class="r-val">yes</span>),&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="r-pass">% ✓ yes — passes</span><br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(pain_character, <span class="r-val">crushing</span>),&nbsp;&nbsp;<span class="r-pass">% ✓ crushing — passes</span><br>
    &nbsp;&nbsp;<span class="r-pred">symptom</span>(exertional, <span class="r-val">yes</span>),&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="r-fail">% ✗ FAIL — we asserted no</span><br>
    &nbsp;&nbsp;<span class="r-comment">% Prolog se detiene aquí. No retrocede a otro valor.</span><br>
    &nbsp;&nbsp;<span class="r-comment">% No existe otra cláusula diagnose(angina, _).</span><br>
    &nbsp;&nbsp;<span class="r-comment">% Resultado: angina no produce ninguna solución.</span>
  </div>
</div>
<div class="callout callout-green"><strong>Esto es clínicamente correcto.</strong> La distinción definitoria entre angina estable e IAM es que la angina se provoca con el esfuerzo y cede con el reposo, mientras que el IAM ocurre en reposo y persiste. El dolor del Sr. Mendoza inició sin provocación en su escritorio — el único hecho <code>symptom(exertional, no)</code> codifica esta distinción por completo.</div>
<p>Ahora abra la aplicación, desplácese al final de la página de resultados y expanda <strong>"Ver hechos asertados enviados a Prolog"</strong>. Verá cada <code>symptom/2</code> and <code>finding/2</code> listado — exactamente los hechos que estaban en alcance cuando corrió el motor. Este panel es su principal herramienta de depuración cuando sus propias reglas no se comportan como se espera.</p>`,

/* 9 — Key insights */
`<div class="phase-badge badge-learn">Puntos clave</div>
<h1 class="slide-title">Cinco cosas que recordar antes de escribir su módulo</h1>
<p class="slide-sub">Estos patrones aparecen en todo módulo CAD bien escrito. Cada uno está ilustrado por algo que acaba de ver en esta sesión.</p>
<div class="insight-list">
  <div class="insight"><div class="insight-num">1</div><div class="insight-body">
    <div class="insight-title">La tabla de frecuencias debe ir primero</div>
    <div class="insight-text"><code>diagnose/2</code> termina con <code>frequency(Diagnosis, Frequency)</code>. Si escribe una regla antes de su hecho <code>frequency/2</code> , la regla falla silenciosamente siempre — sin error, sin salida. Defina la tabla de frecuencias completa antes de cualquier regla.</div>
  </div></div>
  <div class="insight"><div class="insight-num">2</div><div class="insight-body">
    <div class="insight-title">Múltiples cláusulas para un diagnóstico son correctas</div>
    <div class="insight-text">El IAM tiene dos reglas independientes porque tiene dos presentaciones clínicas distintas. Prolog las encuentra todas por retroceso; el puente deduplica. Use múltiples cláusulas siempre que un diagnóstico tenga perfiles de síntomas genuinamente diferentes.</div>
  </div></div>
  <div class="insight"><div class="insight-num">3</div><div class="insight-body">
    <div class="insight-title">Las variables dentro de \+ son locales — use if-then en su lugar</div>
    <div class="insight-text"><code>\+ symptom(X, D), D &gt;= 20</code> is a bug: <code>D</code> está indefinida fuera de <code>\+</code>. Use <code>( symptom(X, D) -&gt; D &lt; 20 ; true )</code> para comprobaciones numéricas condicionales. Este fue el primer error que detectamos en la regla de angina durante las pruebas.</div>
  </div></div>
  <div class="insight"><div class="insight-num">4</div><div class="insight-body">
    <div class="insight-title">exclude_if se activa después de diagnose/2</div>
    <div class="insight-text">El puente recopila todos los diagnósticos primero, luego verifica exclusiones. Use <code>diagnose/2</code> para evidencia positiva; use <code>exclude_if/2</code> para restricciones de seguridad inapelables. Un diagnóstico puede coincidir con su regla y aun así ser excluido.</div>
  </div></div>
  <div class="insight"><div class="insight-num">5</div><div class="insight-body">
    <div class="insight-title">explain_step/3 es parte del contrato</div>
    <div class="insight-text">Cada síntoma que su regla <code>diagnose/2</code> verifica necesita una cláusula <code>explain_step/3</code> correspondiente. Si falta, el panel de demostración muestra una advertencia. Escriba la justificación como un clínico se la explicaría a un colega junior — ese es el estándar que verifica la suite de pruebas.</div>
  </div></div>
</div>`,

<h1 class="slide-title">Cuatro variantes para ejecutar antes de escribir su propio módulo</h1>
<p class="slide-sub">Cada variante cambia una o dos respuestas clave. Ejecútelas en la aplicación, luego abra <code style="font-family:var(--font-mono);font-size:12px;background:var(--navy-50);padding:2px 5px;border-radius:4px">chest_pain.pl</code> y rastree cada resultado hasta su regla.</p>
<div class="variants">
  <div class="variant">
    <div class="variant-letter">A</div>
    <div class="variant-title">Angina estable clásica</div>
    <div class="variant-body">Mismo paciente. Cambie: esfuerzo = <strong>Sí</strong>, duración = <strong>8 minutos</strong>. Todo lo demás igual.</div>
    <div class="variant-expect">→ esperado: angina (común)<br>→ el IAM no debe aparecer</div>
  </div>
  <div class="variant">
    <div class="variant-letter">B</div>
    <div class="variant-title">Pericarditis</div>
    <div class="variant-body">Cualquier edad/sexo. Dolor: central, pleurítico = <strong>Sí</strong>, cede al inclinarse = <strong>Sí</strong>. Sin irradiación, sin sudoración, sin esfuerzo.</div>
    <div class="variant-expect">→ esperado: pericarditis (occasional)<br>→ IAM y angina no deben aparecer</div>
  </div>
  <div class="variant">
    <div class="variant-letter">C</div>
    <div class="variant-title">Herpes zóster</div>
    <div class="variant-body">Cualquier edad. Dolor: ardoroso, dermatomérico unilateral = <strong>Sí</strong>. Hallazgo: exantema vesicular = <strong>Sí</strong>. Sin hallazgos cardíacos.</div>
    <div class="variant-expect">→ esperado: herpes_zoster únicamente<br>→ único diagnóstico activo</div>
  </div>
  <div class="variant">
    <div class="variant-letter">D</div>
    <div class="variant-title">exclude_if/2 en dos sesiones</div>
    <div class="variant-body"><strong>Sesión D1:</strong> carácter atípico + ánimo deprimido = <strong>Sí</strong> + resto No + ECG = <strong>No</strong>. Depression aparece activa.<br><br><strong>Sesión D2:</strong> mismas respuestas pero ECG = <strong>Sí</strong>. La depresión desaparece — excluida por hallazgo orgánico.</div>
    <div class="variant-expect">→ D1: depression (occasional) activa<br>→ D2: excluida por ecg_changes = yes</div>
  </div>
</div>
<div class="callout callout-amber"><strong>El ejercicio (A, B, C):</strong> abra la traza de demostración y rastree cada justificación hasta su cláusula <code>explain_step/3</code> en <code>chest_pain.pl</code>. Esa correspondencia uno a uno entre pantalla y fuente es exactamente lo que construirá para su propio módulo. <strong>Variante D:</strong> compare el resultado entre las dos sesiones y localice la cláusula <code>exclude_if/2</code> que cambia el resultado.</div>
<div class="callout callout-green" style="margin-top:12px"><strong>Ya está listo/a</strong> para abrir su stub asignado en <code>prolog/stubs/</code>, leer <code>docs/PROLOG_CONTRACT.md</code>, y comenzar a escribir reglas. El flujo de trabajo es: completar la tabla de frecuencias → escribir reglas diagnose/2 → agregar suggest_test/2 → agregar explain_step/3 → ejecutar <code>pytest tests/test_kb.py</code> → todas las pruebas pasan → abrir un pull request.</div>`,

];

let current = 0;

function buildRail() {
  const rail = document.getElementById('rail');
  rail.innerHTML = STEPS.map((s, i) => `
    <div class="rail-step ${i === 0 ? 'active' : ''}" onclick="goTo(${i})" id="rs${i}">
      <div class="step-dot">${i < current ? '✓' : i + 1}</div>
      <div class="step-label">${s.label}<br><span style="font-size:10px;color:var(--navy-200)">${s.sub}</span></div>
    </div>
    ${i < STEPS.length - 1 ? `<div class="rail-conn" id="rc${i}"></div>` : ''}
  `).join('');
}

function buildSlides() {
  const container = document.getElementById('slides');
  container.innerHTML = SLIDES.map((s, i) =>
    `<div class="slide ${i === 0 ? 'active' : ''}" id="slide${i}">${s}</div>`
  ).join('');
}

function updateUI() {
  // Slides
  document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === current));
  // Rail
  STEPS.forEach((_, i) => {
    const rs = document.getElementById('rs' + i);
    const rc = document.getElementById('rc' + i);
    rs.classList.toggle('active', i === current);
    rs.classList.toggle('done', i < current);
    rs.querySelector('.step-dot').textContent = i < current ? '✓' : i + 1;
    if (rc) rc.classList.toggle('done', i < current);
  });
  // Progress
  document.getElementById('progress').style.width = ((current / (STEPS.length - 1)) * 100) + '%';
  // Nav
  document.getElementById('navInfo').textContent = `Paso ${current + 1} de ${STEPS.length}`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').textContent = current === STEPS.length - 1 ? 'Finalizar ✓' : 'Siguiente →';
  document.getElementById('nextBtn').disabled = false;
  // Scroll
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function go(dir) {
  const next = current + dir;
  if (next >= 0 && next < STEPS.length) { current = next; updateUI(); }
}

function goTo(i) { current = i; updateUI(); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(-1);
});

buildRail();
buildSlides();
updateUI();
</script>
</body>
</html>
